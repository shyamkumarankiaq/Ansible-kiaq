
---
- name: Task 5 - Harbor Registry
  hosts: webservers
  become: true

  tasks:
    - name: Install Harbor prerequisites
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - curl
          - openssl
          - tar
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Check available disk space
      ansible.builtin.command: df -h /
      register: disk_space
      changed_when: false

    - name: Display available disk space
      ansible.builtin.debug:
        var: disk_space.stdout_lines

    - name: Display Harbor deployment information
      ansible.builtin.debug:
        msg: >-
          Harbor prerequisites are installed.
          Check that the server has sufficient RAM and disk space
          before deploying Harbor.
