---
- name: Install and configure Nginx
  hosts: webservers
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Deploy custom website
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Ansible Automation Lab</title>
          </head>
          <body>
            <h1>Nginx deployed using Ansible!</h1>
            <p>Task 3 completed successfully.</p>
          </body>
          </html>
        owner: root
        group: root
        mode: "0644"

    - name: Start and enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Verify Nginx HTTP response
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
        return_content: true
      register: nginx_response

    - name: Display HTTP verification
      ansible.builtin.debug:
        msg: "Nginx HTTP status: {{ nginx_response.status }}"
